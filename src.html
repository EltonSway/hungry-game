<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ГОЛОДНЫЙ · сожри район</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --ink:#1b1330; --paper:#fffdf5; --dim:#6b6480;
  --acid:#ffd60a; --hot:#ff3d6e; --mint:#00d3a7; --sky:#3aa8ff; --grape:#7b4dff;
  --card:#ffffffee; --line:#1b133014;
  --disp:'Unbounded',system-ui,sans-serif;
  --body:'Rubik',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#8fd4ff;color:var(--ink);font-family:var(--body);
  overscroll-behavior:none}
body{user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

.screen{position:fixed;inset:0;z-index:5;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------------- МЕНЮ ---------------- */
#menu{padding:calc(env(safe-area-inset-top) + 12px) 16px 16px;justify-content:space-between}
.top{display:flex;gap:7px;align-items:center}
.pill{display:flex;align-items:center;gap:5px;background:var(--card);border:2px solid #1b13300f;
  border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--ink);
  box-shadow:0 4px 0 #1b133014}
.pill b{font-family:var(--disp)}
.spacer{flex:1}

.hero{text-align:center;margin-top:-9vh;width:100%}
.hero .kicker{display:inline-block;font-size:11px;letter-spacing:.3em;color:#fff;font-weight:700;
  background:var(--hot);border-radius:999px;padding:5px 14px;margin-bottom:12px;
  box-shadow:0 4px 0 #c9184a}
.hero h1{font-family:var(--disp);font-weight:900;font-size:clamp(34px,11vw,64px);line-height:.88;
  letter-spacing:-.035em;text-transform:uppercase;color:#fff;
  text-shadow:0 3px 0 #ff9f1c,0 7px 0 #ff3d6e,0 12px 26px #1b133055}
.hero .sub{margin-top:14px;color:#fff;font-size:14px;line-height:1.5;font-weight:500;
  text-shadow:0 2px 8px #1b133066}
.hero .sub em{font-style:normal;font-weight:700;background:var(--acid);color:var(--ink);
  padding:1px 8px;border-radius:6px}
.best{margin-top:14px;display:inline-flex;gap:10px;align-items:center;background:#ffffffdd;
  border-radius:999px;padding:8px 16px;font-size:13px;color:var(--dim);font-weight:600}
.best b{color:var(--ink);font-family:var(--disp);font-size:15px}

.bottom{display:flex;flex-direction:column;gap:10px}
.play{position:relative;border:0;border-radius:22px;padding:19px;font-family:var(--disp);font-weight:900;
  font-size:23px;letter-spacing:.03em;color:#1b1330;background:linear-gradient(180deg,#ffe95c,#ffc300);
  box-shadow:0 7px 0 #d19700,0 16px 34px #ff9f1c55;text-transform:uppercase;overflow:hidden}
.play:active{transform:translateY(4px);box-shadow:0 3px 0 #d19700}
.play::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:38%;transform:skewX(-20deg);
  background:linear-gradient(90deg,#fff0,#ffffffcc,#fff0);animation:shine 3.2s infinite}
@keyframes shine{0%,64%{left:-60%}100%{left:130%}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{position:relative;border:0;background:var(--card);color:var(--ink);border-radius:18px;padding:12px 8px;
  font-family:var(--body);font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px;
  box-shadow:0 5px 0 #1b13301a;text-align:left}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1b13301a}
.btn i{font-style:normal;font-size:21px;flex:none;width:34px;height:34px;border-radius:11px;
  display:grid;place-items:center;background:#1b13300d}
.btn u{display:block;text-decoration:none;font-size:11px;color:var(--dim);font-weight:600}
.dot{position:absolute;right:9px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--hot);
  box-shadow:0 0 0 3px #ff3d6e33}

/* ---------------- ЛИСТЫ ---------------- */
#sheet{position:fixed;inset:0;z-index:8;display:none;background:#1b133066;backdrop-filter:blur(4px)}
#sheet.on{display:block}
.sheetbox{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--paper);
  border-radius:28px 28px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);
  animation:up .3s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheetbox h2{font-family:var(--disp);font-size:20px;text-transform:uppercase;margin-bottom:3px}
.sheetbox .lead{color:var(--dim);font-size:13px;margin-bottom:15px}
.sec{font-family:var(--disp);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:16px 2px 9px}
.sec:first-of-type{margin-top:0}
.item{display:flex;gap:11px;align-items:center;border-radius:18px;padding:12px;margin-bottom:9px;
  background:#1b13300a}
.item.locked{opacity:.62}
.item .ic{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:23px;
  background:#fff;box-shadow:0 3px 0 #1b133014}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-size:15px}
.item .txt span{font-size:12px;color:var(--dim)}
.bar{height:6px;border-radius:3px;background:#1b133014;margin-top:7px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acid),var(--hot));border-radius:3px}
.buy{border:0;border-radius:13px;padding:10px 13px;font-family:var(--body);font-weight:700;font-size:13px;
  background:var(--acid);color:var(--ink);white-space:nowrap;box-shadow:0 4px 0 #d19700}
.buy:active{transform:translateY(2px);box-shadow:0 2px 0 #d19700}
.buy[disabled]{background:#1b13300f;color:#1b133055;box-shadow:none}
.buy.owned{background:var(--mint);color:#04231d;box-shadow:0 4px 0 #00a482}
.close{width:100%;margin-top:6px;border:0;background:#1b13300d;color:var(--ink);border-radius:18px;
  padding:15px;font-family:var(--body);font-weight:700;font-size:15px}

/* ---------------- ИГРА ---------------- */
#hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 12px}
#hud.on{display:block}
.hrow{display:flex;gap:7px;align-items:flex-start}
#clock{font-family:var(--disp);font-size:24px;font-weight:900;background:var(--card);
  border-radius:16px;padding:6px 13px;box-shadow:0 4px 0 #1b133014}
#clock.low{color:var(--hot);animation:pulse .55s infinite}
@keyframes pulse{50%{opacity:.5}}
#wt{font-family:var(--disp);font-size:19px;font-weight:900}
#wt small{font-size:11px;color:var(--dim);font-weight:500}
#exit{pointer-events:auto;border:0;background:var(--card);border-radius:14px;width:38px;height:38px;
  font-size:17px;box-shadow:0 4px 0 #1b133014}
#combo{position:fixed;left:0;right:0;top:23vh;text-align:center;z-index:4;pointer-events:none;
  font-family:var(--disp);font-weight:900;font-size:clamp(34px,12vw,58px);color:#fff;opacity:0;
  text-shadow:0 3px 0 #ff9f1c,0 6px 0 #ff3d6e,0 10px 30px #1b133066}
#combo.pop{animation:cpop .55s ease-out}
@keyframes cpop{0%{opacity:0;transform:scale(.5) rotate(-8deg)}28%{opacity:1;transform:scale(1.18) rotate(4deg)}100%{opacity:0;transform:scale(1.02)}}
#buffs{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:4;display:flex;gap:7px}
.buff{background:var(--card);border-radius:13px;padding:6px 10px;font-size:13px;font-weight:700;
  box-shadow:0 4px 0 #1b133014}
#mini{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 58px);width:78px;height:78px;z-index:4;
  border-radius:16px;background:#ffffffcc;box-shadow:0 4px 0 #1b133014;display:none}
#dash{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:6;display:none;
  width:82px;height:82px;border:0;border-radius:50%;font-size:34px;
  background:radial-gradient(circle at 50% 34%,#ff8a5c,#ff3d6e);color:#fff;
  box-shadow:0 7px 0 #c9184a,0 12px 30px #ff3d6e55}
#dash:active{transform:translateY(4px);box-shadow:0 3px 0 #c9184a}
#dash.cool{background:#1b133033;box-shadow:0 5px 0 #1b133022;color:#ffffff88}
#dash b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-size:22px}
#tip{position:fixed;left:0;right:0;bottom:30%;text-align:center;z-index:4;color:#fff;font-size:15px;
  font-weight:600;text-shadow:0 2px 10px #1b133088;transition:opacity .5s;display:none}
#flashfx{position:fixed;inset:0;z-index:3;pointer-events:none;background:#ff3d6e;opacity:0;
  transition:opacity .25s}

/* ---------------- ИТОГ ---------------- */
#res{background:linear-gradient(160deg,#ffd60a,#ff9f1c 45%,#ff3d6e);align-items:center;justify-content:center;
  padding:24px 18px;text-align:center;gap:4px}
#res .t{font-family:var(--disp);font-size:12px;letter-spacing:.3em;color:#ffffffcc;text-transform:uppercase}
#res .big{font-family:var(--disp);font-weight:900;font-size:clamp(58px,22vw,104px);line-height:1;color:#fff;
  text-shadow:0 5px 0 #c9184a,0 14px 34px #1b133055}
#res .unit{font-family:var(--disp);font-size:17px;color:#fff}
#res .rank{font-family:var(--disp);font-size:18px;margin-top:12px;background:#fff;color:var(--ink);
  border-radius:999px;padding:9px 20px;box-shadow:0 5px 0 #1b133022}
#res .newrec{color:#fff;font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-top:10px}
#res .stats{display:flex;gap:9px;margin:18px 0 4px;flex-wrap:wrap;justify-content:center}
#res .st{background:#ffffff2e;border-radius:16px;padding:10px 14px;min-width:92px;color:#fff}
#res .st b{display:block;font-family:var(--disp);font-size:18px}
#res .st span{font-size:11px;opacity:.85}
#res .acts{display:flex;flex-wrap:wrap;gap:9px;width:100%;max-width:360px;margin-top:20px}
#res .acts .play{flex:1 1 100%}
#res .acts .btn{flex:1 1 0;min-width:0;justify-content:center}
#toast{position:fixed;left:50%;top:13%;transform:translateX(-50%);z-index:20;display:none;
  background:#fff;color:var(--ink);font-weight:700;font-size:14px;padding:11px 17px;border-radius:15px;
  box-shadow:0 7px 0 #1b133022;white-space:nowrap}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="flashfx"></div>

<!-- МЕНЮ -->
<div class="screen on" id="menu">
  <div class="top">
    <div class="pill">🪙 <b id="coins">0</b></div>
    <div class="pill">🏆 <b id="best">0</b> кг</div>
    <div class="spacer"></div>
    <div class="pill" id="muteBtn">🔊</div>
  </div>

  <div class="hero">
    <div class="kicker">сожри район</div>
    <h1>Голодный</h1>
    <div class="sub">90 секунд. Ешь всё. Убегай от ППС.</div>
  </div>

  <div class="bottom">
    <button class="play" id="playBtn">Играть</button>
    <div class="grid">
      <button class="btn" id="shopBtn"><i>🛒</i><span>Магазин<u id="shopHint">прокачка и скины</u></span></button>
      <button class="btn" id="misBtn"><span class="dot" id="misDot"></span><i>🎯</i><span>Задания<u id="misHint">0/3</u></span></button>
    </div>
  </div>
</div>

<!-- ЛИСТ -->
<div id="sheet"><div class="sheetbox">
  <h2 id="shTitle"></h2><div class="lead" id="shLead"></div>
  <div id="shBody"></div>
  <button class="close" id="shClose">Закрыть</button>
</div></div>

<!-- ИГРА -->
<div id="hud">
  <div class="hrow">
    <div id="clock">1:30</div>
    <div class="pill"><span id="wt">62<small> кг</small></span></div>
    <div class="spacer"></div>
    <button id="exit">✕</button>
  </div>
</div>
<div id="combo"></div>
<div id="buffs"></div>
<canvas id="mini" width="78" height="78"></canvas>
<button id="dash">💨</button>
<div id="tip">веди пальцем — он поедет за тобой</div>

<!-- ИТОГ -->
<div class="screen" id="res">
  <div class="t">сожрал</div>
  <div class="big" id="resKg">0</div>
  <div class="unit">килограммов</div>
  <div class="rank" id="resRank"></div>
  <div class="newrec" id="resRec" style="visibility:hidden">новый рекорд!</div>
  <div class="stats">
    <div class="st"><b id="resCnt">0</b><span>заведений</span></div>
    <div class="st"><b id="resHouse">0</b><span>домов снёс</span></div>
    <div class="st"><b id="resCoin">0</b><span>монет 🪙</span></div>
  </div>
  <div class="acts">
    <button class="play" id="againBtn">Ещё разок</button>
    <button class="btn" id="shareBtn"><i>📣</i>Хвастаться</button>
    <button class="btn" id="menuBtn"><i>🏠</i>В меню</button>
  </div>
</div>

<div id="toast"></div>

<script>__THREE__</script>
<script>
const FACE_SRC = "__FACE__";
const TG = window.Telegram && window.Telegram.WebApp;
if (TG){
  TG.ready(); TG.expand();
  TG.disableVerticalSwipes && TG.disableVerticalSwipes();   // чтобы свайп вниз не закрывал игру
  TG.setHeaderColor && TG.setHeaderColor("#8fd4ff");
  TG.setBackgroundColor && TG.setBackgroundColor("#8fd4ff");
}
const haptic = t => { try{ TG && TG.HapticFeedback.impactOccurred(t); }catch(e){} };
const $ = id => document.getElementById(id);
document.addEventListener("touchmove", e=>{ if(e.cancelable) e.preventDefault(); }, {passive:false});

/* ================= сохранёнка ================= */
const DEF = { coins:0, best:0, xp:0, up:{speed:0,magnet:0,appetite:0}, skin:0, owned:[0],
              zone:0, zones:[0], day:"", mis:null, mute:false };
let S = Object.assign({}, DEF, JSON.parse(localStorage.getItem("hungry2")||"{}"));
S.up = Object.assign({}, DEF.up, S.up);
const save = ()=> localStorage.setItem("hungry2", JSON.stringify(S));

const UPS = [
  { k:"speed",    ic:"👟", name:"Кроссы Абибас", desc:"бегает быстрее",          max:5, cost:l=>60+l*70 },
  { k:"magnet",   ic:"🧲", name:"Нюх на еду",    desc:"жратва сама летит в рот", max:5, cost:l=>90+l*110 },
  { k:"appetite", ic:"🍽", name:"Батин аппетит", desc:"больше кг с точки",       max:5, cost:l=>80+l*90 },
];
const SKINS = [
  { name:"Обычный ара",  ic:"😋", cost:0,    glow:0xffd60a },
  { name:"Золотой зять", ic:"👑", cost:600,  glow:0xffa600 },
  { name:"Неон-брат",    ic:"⚡", cost:1500, glow:0x00d3a7 },
  { name:"Адский повар", ic:"🔥", cost:3000, glow:0xff3d6e },
];
/* районы — мета-прогрессия */
const ZONES = [
  { name:"Спальник",   ic:"🏢", cost:0,    spots:40, mult:1,   cops:2,
    sky:["#8fd4ff","#d8f3ff"], road:"#6f7684", grass:"#6bbf47", hmin:40, hmax:120,
    pal:[0xff8f6b,0xffd166,0x76d7c4,0x8fb8ff,0xffffff,0xd6a4ff] },
  { name:"Центр",      ic:"🌆", cost:1200, spots:52, mult:1.25, cops:3,
    sky:["#ff9a6b","#ffd6a5"], road:"#6c6f7d", grass:"#5fae46", hmin:70, hmax:230,
    pal:[0xff5d8f,0xffc300,0x00d3a7,0x4cc9f0,0xfff1d0,0x7b4dff] },
  { name:"Набережная", ic:"🌴", cost:3500, spots:60, mult:1.55, cops:4,
    sky:["#3aa8ff","#a8f0ff"], road:"#8b93a3", grass:"#3fc97a", hmin:35, hmax:150,
    pal:[0x00d3a7,0xffd60a,0xff6b9d,0x5ce1e6,0xffffff,0xffa45c] },
];
const lvlOf = xp => 1 + Math.floor(Math.sqrt(xp/60));

/* ================= константы мира ================= */
const COLS=6, ROWS=6, BLOCK=300, ROAD=110;
const W = ROAD+COLS*(BLOCK+ROAD), H = ROAD+ROWS*(BLOCK+ROAD);
const ROUND = 90;
const KINDS = [
  { name:"Чайхона №1",      emo:"🥘", col:0xe8a33d, kg:5,  area:150, w:30 },
  { name:"Додо",            emo:"🍕", col:0xff6a00, kg:4,  area:120, w:30 },
  { name:"Вкусно — и точка",emo:"🍔", col:0x00b055, kg:3,  area:90,  w:30 },
  { name:"Шаурма 24/7",     emo:"🌯", col:0xc23b22, kg:12, area:300, w:10 },
];
const GOLD = { name:"ЗОЛОТАЯ ЧАЙХОНА", emo:"🏆", col:0xffd60a, kg:40, area:700 };
const BUFFS = [
  { id:"x2",    emo:"⭐", col:0xffd60a, time:8, label:"x2 очки" },
  { id:"speed", emo:"🌶", col:0xff3d6e, time:7, label:"турбо" },
  { id:"mag",   emo:"🧲", col:0x3aa8ff, time:8, label:"магнит" },
];
const MEMES = ["ЖОР!","ЗАЛЕТЕЛО","ЕЩЁ ОДНУ","АМИНЬ 🙏","БАТЯ В ДЕЛЕ","НЕ НАЕЛСЯ","ГДЕ МЯСО?","ПЛОВ-МАШИНА","ПО АКЦИИ","ДОБАВКИ!"];
const RANKS = [[140,"Поел как воробей 🐦"],[280,"Норм пацан 🙂"],[450,"Плов-машина 🥘"],
               [700,"Гроза чайхон 😤"],[1100,"Чёрная дыра 🕳"],[1e9,"СОЖРАЛ РАЙОН 🔥"]];
const rankOf = kg => RANKS.find(r=>kg<r[0])[1];
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pickKind = ()=>{ let r=Math.random()*100; for(const k of KINDS){ r-=k.w; if(r<=0) return k; } return KINDS[0]; };

/* ================= three ================= */
const renderer = new THREE.WebGLRenderer({ canvas:$("gl"), antialias:true, powerPreference:"high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(54, 1, 1, 6000);
const hemi = new THREE.HemisphereLight(0xcfe9ff, 0x4a6b34, .58); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1cf, .92); sun.position.set(-500,900,420); scene.add(sun);

function cvTex(w,h,f,rx,ry){
  const c=document.createElement("canvas"); c.width=w; c.height=h; f(c.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(c);
  if(rx){ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry); }
  return t;
}

/* небо-купол */
const skyTex = cvTex(4,256,(g,w,h)=>{ const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,"#8fd4ff"); gr.addColorStop(1,"#d8f3ff"); g.fillStyle=gr; g.fillRect(0,0,w,h); });
const sky = new THREE.Mesh(new THREE.SphereGeometry(3400,24,16),
  new THREE.MeshBasicMaterial({ map:skyTex, side:THREE.BackSide, fog:false }));
scene.add(sky);
function paintSky(a,b){
  const c = skyTex.image, g = c.getContext("2d");
  const gr = g.createLinearGradient(0,0,0,c.height);
  gr.addColorStop(0,a); gr.addColorStop(1,b); g.fillStyle=gr; g.fillRect(0,0,c.width,c.height);
  skyTex.needsUpdate = true;
  scene.fog = new THREE.Fog(new THREE.Color(b).getHex(), 900, 2600);
}

/* земля: асфальт + тротуары + газоны */
const groundTex = cvTex(2048,2048,()=>{},1,1);
function paintGround(z){
  const c=groundTex.image, g=c.getContext("2d"), w=c.width, k=w/W;
  g.fillStyle=z.grass; g.fillRect(0,0,w,w);
  g.fillStyle=z.road;
  for(let i=0;i<=COLS;i++) g.fillRect((i*(BLOCK+ROAD))*k,0,ROAD*k,w);
  for(let j=0;j<=ROWS;j++) g.fillRect(0,(j*(BLOCK+ROAD))*k,w,ROAD*k);
  g.fillStyle="#e9e4d8";                                            // тротуары
  for(let i=0;i<=COLS;i++){ const x=(i*(BLOCK+ROAD))*k; g.fillRect(x-7,0,7,w); g.fillRect(x+ROAD*k,0,7,w); }
  for(let j=0;j<=ROWS;j++){ const y=(j*(BLOCK+ROAD))*k; g.fillRect(0,y-7,w,7); g.fillRect(0,y+ROAD*k,w,7); }

function putHouse(b){

  _m.compose(_v.set(b.x, hh+3, b.z), _q, _s.set(ww+5, 7, dd+5));
  roofInst.setMatrixAt(b.i, _m);
  roofInst.setColorAt(b.i, _c2.setHex(b.col).multiplyScalar(.42));
  _m.compose(_v.set(b.x + hh*SHX, .6, b.z + hh*SHZ), _rq, _s.set(ww*1.04, dd*1.04, 1));

const keys={};
addEventListener("keydown",e=>{ keys[e.key.toLowerCase()]=true; if(e.code==="Space") doDash(); });
addEventListener("keyup",  e=>keys[e.key.toLowerCase()]=false);
const MAXR=70, DEAD=7;
let stick=null;
const gl=$("gl");
gl.addEventListener("pointerdown",e=>{
  if(mode!=="playing") return;
  stick={bx:e.clientX,by:e.clientY,dx:0,dy:0}; gl.setPointerCapture(e.pointerId);
  $("tip").style.opacity=0;
});
gl.addEventListener("pointermove",e=>{
  if(!stick) return;
  let dx=e.clientX-stick.bx, dy=e.clientY-stick.by;
  const l=Math.hypot(dx,dy);
  if(l>MAXR){ stick.bx=e.clientX-dx/l*MAXR; stick.by=e.clientY-dy/l*MAXR; dx=dx/l*MAXR; dy=dy/l*MAXR; }
  stick.dx=dx; stick.dy=dy;
});
const drop=()=>stick=null;
gl.addEventListener("pointerup",drop); gl.addEventListener("pointercancel",drop);
function input(){
  let dx=0,dy=0;
  if(keys.a||keys.arrowleft)dx-=1; if(keys.d||keys.arrowright)dx+=1;
  if(keys.w||keys.arrowup)dy-=1;   if(keys.s||keys.arrowdown)dy+=1;
  let l=Math.hypot(dx,dy);
  if(l>0) return {x:dx/l,y:dy/l,p:1};
  if(stick){
    l=Math.hypot(stick.dx,stick.dy);
    if(l>DEAD) return {x:stick.dx/l,y:stick.dy/l,p:clamp((l-DEAD)/(MAXR-DEAD),0,1)};
  }
  return {x:0,y:0,p:0};
}
function doDash(){
  if(mode!=="playing"||G.dashCd>0) return;
  G.dash=.42; G.dashCd=2.4; haptic("medium"); blip(520,.14); shake=Math.max(shake,7);
}
$("dash").addEventListener("pointerdown",e=>{ e.preventDefault(); doDash(); });
$("exit").onclick = ()=>{ if(mode==="playing") endGame(); };

/* ================= шаг ================= */
function step(dt){
  const d=input();
  const dashing = G.dash>0;
  const speed = 175*G.spd*Math.pow(16/G.r,.3)*(G.buffs.speed?1.75:1)*(dashing?3.1:1);
  const tx=d.x*speed*d.p, tz=d.y*speed*d.p;
  const acc = dashing?26:10;
  if(dashing && d.p<.1){ G.vx*=1.0; G.vz*=1.0; }                 // рывок держит текущее направление
  else { G.vx+=(tx-G.vx)*Math.min(1,dt*acc); G.vz+=(tz-G.vz)*Math.min(1,dt*acc); }
  if(dashing){ const l=Math.hypot(G.vx,G.vz)||1; G.vx=G.vx/l*speed; G.vz=G.vz/l*speed; }
  player.position.x = clamp(player.position.x+G.vx*dt, G.r, W-G.r);
  player.position.z = clamp(player.position.z+G.vz*dt, G.r, H-G.r);
  G.dash=Math.max(0,G.dash-dt); G.dashCd=Math.max(0,G.dashCd-dt); G.inv=Math.max(0,G.inv-dt);

  body.scale.setScalar(G.r*(1+G.punch));
  body.visible = !(G.inv>0 && Math.sin(G.inv*30)>0);
  pshadow.position.set(player.position.x + G.r*SHX*1.2, .8, player.position.z + G.r*SHZ*1.2);
  pshadow.scale.setScalar(G.r*1.05);
  halo.scale.set(G.r*7,G.r*7,1);
  G.punch = Math.max(0, G.punch-dt*2.6);
  const v=Math.hypot(G.vx,G.vz);
  G.spin += dt*(0.9+v/G.r*1.5)*(G.chewSpin>0?4:1);
  body.rotation.y=-G.spin; body.rotation.x=Math.sin(G.spin*2)*.06;
  player.position.y = G.r + Math.abs(Math.sin(G.spin*3))*G.r*.05;
  G.chewSpin=Math.max(0,G.chewSpin-dt);

  // дома: сносим, если перерос
  for(const b of houses){
    if(b.fall>0){ b.fall=Math.min(1,b.fall+dt*2.4); putHouse(b); if(b.fall>=1) b.alive=false; continue; }
    if(!b.alive) continue;
    const hw=b.w/2+G.r, hd=b.d/2+G.r;
    const dx=player.position.x-b.x, dz=player.position.z-b.z;
    if(Math.abs(dx)<hw && Math.abs(dz)<hd){
      const canCrush = G.r > Math.min(b.w,b.d)*.42 || dashing;
      if(canCrush){
        b.fall=.01; G.houses++; G.kg+=6; G.punch=.16; shake=Math.max(shake,16);
        burst(b.x,b.z,b.col,16,190); haptic("heavy"); blip(120,.2);
        flash("🏚 снёс дом +6 кг");
      } else {                                                    // упираемся в стену
        if(Math.abs(dx)/hw > Math.abs(dz)/hd){ player.position.x = b.x + Math.sign(dx)*hw; G.vx*=-.25; }
        else { player.position.z = b.z + Math.sign(dz)*hd; G.vz*=-.25; }
      }
    }
  }
  markCity();

  // еда
  const magR = S.up.magnet*26 + (G.buffs.mag?230:0);
  for(const o of spots){
    if(!o.alive) continue;
    o.t+=dt;
    o.ic.position.y = (o.gold?66:(o.buff?46:42)) + Math.sin(o.t*2.6)*4;
    o.ring.material.opacity = .3+Math.sin(o.t*3.4)*.18;
    if(o.gold){ o.life-=dt; o.g.rotation.y+=dt*2.2; if(o.life<=0){ o.alive=false; o.g.visible=false; continue; } }
    let dx=player.position.x-o.x, dz=player.position.z-o.z;
    const dist=Math.hypot(dx,dz)||1;
    if(magR>0 && dist<magR+G.r){
      const pull=280*dt*(1-dist/(magR+G.r));
      o.x+=dx/dist*pull; o.z+=dz/dist*pull; o.g.position.set(o.x,0,o.z);
    }
    if(dist < G.r+16) eat(o);
  }

  // инспекторы
  for(const c of cops){
    if(!c.g.visible) continue;
    c.light.material.color.setHex(Math.sin(performance.now()/120)>0 ? 0xff3d6e : 0x2b6cff);
    if(c.stun>0){ c.stun-=dt; c.g.position.y=Math.sin(c.stun*30)*4; c.body.material.color.setHex(0xc9ced8); continue; }
    c.g.position.y=0;
    const dx=player.position.x-c.x, dz=player.position.z-c.z, l=Math.hypot(dx,dz)||1;
    const cs = 122 + G.eaten*0.7 + (ROUND-G.t)*0.55;
    c.cd = Math.max(0, c.cd-dt);

    if(c.atk>0){                                   // рывок по прямой — вот от него и уклоняемся
      c.atk-=dt; c.x+=c.ax*dt; c.z+=c.az*dt;
      c.body.material.color.setHex(0xff3d6e);
      if(c.atk<=0){ c.stun=1.1; c.vx=c.vz=0; c.cd=2.2; }
    } else if(c.charge>0){                         // замах: тормозит и мигает
      c.charge-=dt;
      c.vx*=.86; c.vz*=.86; c.x+=c.vx*dt; c.z+=c.vz*dt;
      c.body.material.color.setHex(Math.sin(c.charge*40)>0 ? 0xff3d6e : 0xffffff);
      c.g.scale.setScalar(1+Math.sin(c.charge*40)*.08);
      if(c.charge<=0){ c.ax=dx/l*430; c.az=dz/l*430; c.atk=.5; c.g.scale.setScalar(1); blip(150,.18); }
    } else {
      c.body.material.color.setHex(0xf2f4f8);
      if(l<300 && c.cd<=0){ c.charge=.65; flashCop(); }
      c.vx += ((dx/l*cs)-c.vx)*Math.min(1,dt*2.2);
      c.vz += ((dz/l*cs)-c.vz)*Math.min(1,dt*2.2);
      c.x+=c.vx*dt; c.z+=c.vz*dt;
    }
    c.x=clamp(c.x,20,W-20); c.z=clamp(c.z,20,H-20);
    c.g.position.set(c.x,c.g.position.y,c.z);
    c.g.rotation.y = Math.atan2(dx,dz)-Math.PI/2;
    if(l < G.r+22){
      if(G.r>58 || G.dash>0){                                     // перерос — сам жрёт инспекторов
        G.kg+=15; G.eaten++; G.punch=.2; shake=Math.max(shake,14);
        burst(c.x,c.z,0x2b6cff,14,160); blip(300,.16); haptic("heavy");
        flash("🚓 сожрал ППСника +15 кг"); missionProgress("cop",1,true); placeCop(c);
      } else if(G.inv<=0){
        G.kg=Math.max(62,G.kg*0.9); G.r=Math.max(16,G.r*0.93); G.combo=0; G.mult=1; c.stun=1.8; G.inv=1.5;
        G.vx=-dx/l*260; G.vz=-dz/l*260;
        shake=Math.max(shake,20); hitFlash(); haptic("heavy"); blip(90,.25);
        flash("🚓 приняли! −7% веса");
      }
      setWeight();
    }
  }

  // золотая чайхона
  G.copT-=dt;
  if(G.copT<=0 && cops.filter(c=>c.g.visible).length < G.zone.cops+3){
    G.copT=30;
    const free = cops.find(c=>!c.g.visible) || newCop();
    placeCop(free); flash("🚓 приехало подкрепление!"); blip(200,.2);
  }
  G.goldT-=dt;
  if(G.goldT<=0){
    G.goldT=26;
    const free = spots.find(s=>!s.alive) || newSpot();
    placeSpot(free,null,true);
    flash("🏆 ЗОЛОТАЯ ЧАЙХОНА! успей за 9 сек");
    blip(880,.18);
  }

  for(const k in G.buffs){ G.buffs[k]-=dt; if(G.buffs[k]<=0) delete G.buffs[k]; }
  if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0){ G.combo=0; G.mult=1; } }
  renderBuffs();

  // камера + тряска
  const want = 100+G.r*4.2;
  G.camD += (want-G.camD)*Math.min(1,dt*2);
  shake = Math.max(0, shake-dt*34);
  const sx = shake?rnd(-shake,shake):0, sz = shake?rnd(-shake,shake):0;
  cam.position.set(player.position.x+sx, G.camD*1.42+sz*.4, player.position.z+G.camD*.62+sz);
  cam.lookAt(player.position.x, 0, player.position.z-G.r*.25);

  const dc=$("dash");
  dc.classList.toggle("cool", G.dashCd>0);
  dc.textContent = G.dashCd>0 ? Math.ceil(G.dashCd) : "💨";

  G.t-=dt;
  const s=Math.max(0,G.t);
  $("clock").textContent = Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
  $("clock").classList.toggle("low", s<=10);
  if(G.t<=0) endGame();
  drawMini();
}

function setWeight(){ $("wt").innerHTML = Math.round(G.kg)+"<small> кг</small>"; }

function eat(o){
  G.chewSpin=.45; G.punch=.12;
  if(o.buff){
    G.buffs[o.buff.id]=o.buff.time;
    burst(o.x,o.z,o.buff.col,12,120); haptic("medium"); blip(760,.12);
    flash(o.buff.emo+" "+o.buff.label);
  } else {
    G.combo++; G.comboT=2.2;
    G.mult=clamp(1+G.combo*.12,1,5);
    if(G.mult>G.bestCombo) G.bestCombo=G.mult;
    const gain=o.kind.kg*G.app*G.mult*(G.buffs.x2?2:1);
    G.kg+=gain; G.eaten++;
    G.r=Math.sqrt(G.r*G.r + o.kind.area*(1+S.up.appetite*.08));
    burst(o.x,o.z,o.kind.col,o.gold?22:12,o.gold?200:110);
    haptic("light"); blip(190+Math.min(G.combo,14)*26,.07);
    setWeight();
    if(o.gold){ shake=Math.max(shake,18); flash("🏆 ЗОЛОТО! +"+Math.round(gain)+" кг"); missionProgress("gold",1,true); }
    else {
      missionProgress("eat_"+KINDS.indexOf(o.kind),1,true);
      if(o.kind.emo==="🌯") flash("🌯 шаурма 24/7 +"+o.kind.kg+" кг");
    }
    if(G.combo>=3){
      const c=$("combo");
      c.textContent = (G.combo%3===0)?MEMES[(Math.random()*MEMES.length)|0]:"x"+G.mult.toFixed(1);
      c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
    }
  }
  o.alive=false; o.g.visible=false;
  if(!o.gold) setTimeout(()=>{
    if(mode!=="playing") return;
    placeSpot(o, Math.random()<.07 ? BUFFS[(Math.random()*BUFFS.length)|0] : null);
  }, 450);
}

/* эффекты */
let copWarn=0;
function flashCop(){
  const t=performance.now();
  if(t-copWarn<3000) return; copWarn=t;
  blip(420,.1); haptic('light');
}
function hitFlash(){
  const f=$("flashfx"); f.style.opacity=.45;
  setTimeout(()=>f.style.opacity=0,120);
}
let AC=null;
function blip(freq,len){
  if(S.mute) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type="triangle"; o.frequency.setValueAtTime(freq,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.45),AC.currentTime+len);
    g.gain.setValueAtTime(.16,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+len);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+len+.02);
  }catch(e){}
}
let toastT=0;
function flash(text){
  const t=$("toast"); t.textContent=text; t.style.display="block";
  clearTimeout(toastT); toastT=setTimeout(()=>t.style.display="none",1500);
}
function renderBuffs(){
  let h="";
  for(const b of BUFFS) if(G.buffs[b.id]) h+=`<div class="buff">${b.emo} ${G.buffs[b.id].toFixed(1)}s</div>`;
  $("buffs").innerHTML=h;
}
function drawMini(){
  const k=78/Math.max(W,H);
  mctx.clearRect(0,0,78,78);
  mctx.fillStyle="#1b133012"; mctx.fillRect(0,0,78,78);
  for(const o of spots){
    if(!o.alive) continue;
    mctx.fillStyle="#"+(o.buff?o.buff.col:o.kind.col).toString(16).padStart(6,"0");
    mctx.fillRect(o.x*k-1.5,o.z*k-1.5, o.gold?5:3, o.gold?5:3);
  }
  mctx.fillStyle="#2b6cff";
  for(const c of cops){ if(c.g.visible) mctx.fillRect(c.x*k-2,c.z*k-2,4,4); }
  mctx.fillStyle="#ff3d6e";
  mctx.beginPath(); mctx.arc(player.position.x*k, player.position.z*k, 3.4,0,7); mctx.fill();
}

/* ================= задания ================= */
function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function rollMissions(){
  const pool=[
    { id:"eat_0", txt:"Обнести 12 чайхон",        goal:12,  rew:120 },
    { id:"eat_1", txt:"Съесть 15 Додо",           goal:15,  rew:120 },
    { id:"eat_2", txt:"Зачистить 18 «Вкусно»",    goal:18,  rew:120 },
    { id:"eat_3", txt:"Схомячить 4 шаурмы 24/7",  goal:4,   rew:250 },
    { id:"cop",   txt:"Сожрать 3 ППСников",         goal:3,   rew:280 },
    { id:"house", txt:"Снести 10 домов",          goal:10,  rew:220 },
    { id:"gold",  txt:"Поймать 2 золотых чайханы",goal:2,   rew:260 },
    { id:"kg",    txt:"Набрать 400 кг за раунд",  goal:400, rew:200 },
    { id:"combo", txt:"Разогнать комбо до x2.5",  goal:2.5, rew:180 },
  ].sort(()=>Math.random()-.5).slice(0,3);
  S.mis = pool.map(m=>Object.assign({p:0,done:false},m));
}
function checkDay(){
  if(S.day!==todayKey()){
    S.day=todayKey(); rollMissions(); S.coins+=100; save();
    setTimeout(()=>flash("🎁 Ежедневный бонус +100 🪙"),800);
  }
  if(!S.mis) rollMissions();
}
function missionProgress(id,val,add){
  let ch=false;
  for(const m of S.mis){
    if(m.id!==id||m.done) continue;
    m.p = add ? m.p+val : Math.max(m.p,val);
    if(m.p>=m.goal){ m.done=true; S.coins+=m.rew; ch=true; flash("🎯 Задание готово +"+m.rew+" 🪙"); }
  }
  if(ch) save();
}

/* ================= меню ================= */
function syncMenu(){
  $("coins").textContent=S.coins; $("best").textContent=S.best;
  const done=S.mis?S.mis.filter(m=>m.done).length:0;
  $("misHint").textContent=done+"/"+(S.mis?S.mis.length:3);
  $("misDot").style.display=(S.mis&&done<S.mis.length)?"block":"none";
  $("shopHint").textContent = ZONES[S.zone].name+" · "+SKINS[S.skin].name;
  halo.material.color.setHex(SKINS[S.skin].glow);
}
function openSheet(kind){
  const b=$("shBody"); let h="";
  if(kind==="shop"){
    $("shTitle").textContent="Магазин"; $("shLead").textContent="Монеты капают за каждый раунд";
    h+=`<div class="sec">Прокачка</div>`;
    UPS.forEach(u=>{
      const l=S.up[u.k], mx=l>=u.max, cost=u.cost(l);
      h+=`<div class="item"><div class="ic">${u.ic}</div><div class="txt">
        <b>${u.name} <span style="color:#ff3d6e">${l}/${u.max}</span></b><span>${u.desc}</span>
        <div class="bar"><i style="width:${l/u.max*100}%"></i></div></div>
        <button class="buy ${mx?'owned':''}" data-up="${u.k}" ${mx||S.coins<cost?"disabled":""}>${mx?"макс":cost+" 🪙"}</button></div>`;
    });
    h+=`<div class="sec">Районы</div>`;
    ZONES.forEach((z,i)=>{
      const own=S.zones.includes(i), on=S.zone===i;
      h+=`<div class="item ${own?'':'locked'}"><div class="ic">${z.ic}</div><div class="txt"><b>${z.name}</b>
        <span>${own?("еда x"+z.mult+" · ППС "+z.cops):"открыть за "+z.cost+" 🪙"}</span></div>
        <button class="buy ${on?'owned':''}" data-zone="${i}" ${(!own&&S.coins<z.cost)||on?"disabled":""}>
        ${on?"выбран":own?"играть":z.cost+" 🪙"}</button></div>`;
    });
    h+=`<div class="sec">Скины</div>`;
    SKINS.forEach((s,i)=>{
      const own=S.owned.includes(i), on=S.skin===i;
      h+=`<div class="item ${own?'':'locked'}"><div class="ic">${s.ic}</div><div class="txt"><b>${s.name}</b>
        <span>${own?(on?"надет":"куплен"):"стоит "+s.cost+" 🪙"}</span></div>
        <button class="buy ${on?'owned':''}" data-skin="${i}" ${(!own&&S.coins<s.cost)||on?"disabled":""}>
        ${on?"надет":own?"надеть":s.cost+" 🪙"}</button></div>`;
    });
  } else {
    $("shTitle").textContent="Задания дня"; $("shLead").textContent="Обновятся завтра";
    S.mis.forEach(m=>{
      const p=Math.min(1,m.p/m.goal);
      h+=`<div class="item"><div class="ic">${m.done?"✅":"🎯"}</div><div class="txt">
        <b>${m.txt}</b><span>${m.done?"получено":(Math.round(m.p*10)/10)+" / "+m.goal+" · +"+m.rew+" 🪙"}</span>
        <div class="bar"><i style="width:${p*100}%"></i></div></div></div>`;
    });
  }
  b.innerHTML=h; $("sheet").classList.add("on");
  b.querySelectorAll("[data-up]").forEach(el=>el.onclick=()=>{
    const u=UPS.find(x=>x.k===el.dataset.up), l=S.up[u.k], c=u.cost(l);
    if(l>=u.max||S.coins<c) return;
    S.coins-=c; S.up[u.k]++; save(); haptic("medium"); blip(660,.1); syncMenu(); openSheet("shop");
  });
  b.querySelectorAll("[data-skin]").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.skin, s=SKINS[i];
    if(!S.owned.includes(i)){ if(S.coins<s.cost) return; S.coins-=s.cost; S.owned.push(i); }
    S.skin=i; save(); haptic("medium"); blip(660,.1); syncMenu(); openSheet("shop");
  });
  b.querySelectorAll("[data-zone]").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.zone, z=ZONES[i];
    if(!S.zones.includes(i)){ if(S.coins<z.cost) return; S.coins-=z.cost; S.zones.push(i); flash("🗺 район открыт!"); }
    S.zone=i; save(); haptic("medium"); blip(660,.1); applyZone(z); syncMenu(); openSheet("shop");
  });
}
$("shClose").onclick=()=>$("sheet").classList.remove("on");
$("sheet").onclick=e=>{ if(e.target.id==="sheet") $("sheet").classList.remove("on"); };
$("shopBtn").onclick=()=>openSheet("shop");
$("misBtn").onclick=()=>openSheet("mis");
$("playBtn").onclick=startGame;
$("againBtn").onclick=startGame;
$("menuBtn").onclick=()=>{ mode="menu"; $("res").classList.remove("on"); $("menu").classList.add("on"); };
$("shareBtn").onclick=()=>{
  const txt=`Сожрал ${$("resKg").textContent} кг за 90 секунд — ${$("resRank").textContent}. Догони 😤`;
  const url="https://t.me/share/url?url="+encodeURIComponent(location.href)+"&text="+encodeURIComponent(txt);
  if(TG&&TG.openTelegramLink) TG.openTelegramLink(url); else window.open(url,"_blank");
};
$("muteBtn").onclick=()=>{ S.mute=!S.mute; save(); $("muteBtn").textContent=S.mute?"🔇":"🔊"; };
$("muteBtn").textContent=S.mute?"🔇":"🔊";

/* ================= цикл ================= */
let menuAngle=0, last=performance.now();
function orbitCam(){
  const cx = 3*(BLOCK+ROAD)+ROAD/2, cz = 3*(BLOCK+ROAD)+ROAD/2;   // перекрёсток, чтобы дома не лезли в кадр
  cam.position.set(cx+Math.cos(menuAngle)*170, 430, cz+Math.sin(menuAngle)*170);
  cam.lookAt(cx,105,cz);
  player.position.set(cx,46,cz);
  body.scale.setScalar(46); halo.scale.set(322,322,1);
  pshadow.position.set(cx+16,.8,cz-14); pshadow.scale.setScalar(49);
  body.rotation.y-=.012;
}
function tick(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(mode==="playing") step(dt); else { menuAngle+=dt*.06; orbitCam(); }
  for(const b of bits){
    if(b.life<=0) continue;
    b.vy-=430*dt; b.life-=dt*1.25;
    b.m.position.x+=b.vx*dt; b.m.position.y+=b.vy*dt; b.m.position.z+=b.vz*dt;
    b.m.scale.setScalar(Math.max(.01,b.life));
    if(b.life<=0||b.m.position.y<0){ b.life=0; b.m.visible=false; }
  }
  renderer.render(scene,cam);
  requestAnimationFrame(tick);
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
}
addEventListener("resize",resize); resize();
checkDay(); syncMenu(); applyZone(ZONES[S.zone]);
for(let i=0;i<40;i++) placeSpot(newSpot());
requestAnimationFrame(tick);
</script>
</body>
