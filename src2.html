<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ГОЛОДНЫЙ · сожри район</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --ink:#1b1330; --paper:#fffdf5; --dim:#6b6480;
  --acid:#ffd60a; --hot:#ff3d6e; --mint:#00d3a7;
  --card:#ffffffee;
  --disp:'Unbounded',system-ui,sans-serif;
  --body:'Rubik',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#8fd4ff;color:var(--ink);font-family:var(--body);
  overscroll-behavior:none}
body{user-select:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;z-index:5;display:none;flex-direction:column}
.screen.on{display:flex}

#intro{position:fixed;inset:0;z-index:40;background:#07080d;transition:opacity .35s}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#07080d}
#skip{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 14px);z-index:45;border:0;
  background:#1b1330d9;color:#fff;font-family:var(--body);font-weight:700;font-size:15px;
  padding:13px 20px;border-radius:999px;box-shadow:0 5px 0 #00000033;backdrop-filter:blur(6px)}
#skip:active{transform:translateY(2px);box-shadow:0 3px 0 #00000022}
#load{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;background:linear-gradient(170deg,#8fd4ff,#d8f3ff 55%,#ffe9a8)}
#load .ttl{font-family:var(--disp);font-weight:900;font-size:clamp(30px,10vw,54px);text-transform:uppercase;
  color:#fff;text-shadow:0 3px 0 #ff9f1c,0 7px 0 #ff3d6e,0 12px 26px #1b133055}
#load .face{width:118px;height:118px;border-radius:50%;overflow:hidden;border:6px solid #fff;
  box-shadow:0 10px 30px #1b133033;animation:bob 1.3s ease-in-out infinite}
#load .face img{width:100%;height:100%;object-fit:cover;object-position:50% 42%}
@keyframes bob{50%{transform:translateY(-9px) rotate(6deg)}}
#load .track{width:min(300px,72vw);height:12px;border-radius:99px;background:#ffffff88;overflow:hidden}
#load .track i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#ffd60a,#ff3d6e);transition:width .25s}
#load .st{font-size:13px;font-weight:600;color:#1b133099}

#menu{padding:calc(env(safe-area-inset-top) + 12px) 16px 16px;justify-content:space-between}
.top{display:flex;gap:7px;align-items:center}
.pill{display:flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:6px 12px;
  font-weight:700;font-size:13px;color:var(--ink);box-shadow:0 4px 0 #1b133014}
.pill b{font-family:var(--disp)}
.spacer{flex:1}
.hero{text-align:center;margin-top:-8vh;width:100%}
.hero .kicker{display:inline-block;font-size:11px;letter-spacing:.3em;color:#fff;font-weight:700;
  background:var(--hot);border-radius:999px;padding:5px 14px;margin-bottom:12px;box-shadow:0 4px 0 #c9184a}
.hero h1{font-family:var(--disp);font-weight:900;font-size:clamp(32px,10.5vw,62px);line-height:.88;
  letter-spacing:-.035em;text-transform:uppercase;color:#fff;
  text-shadow:0 3px 0 #ff9f1c,0 7px 0 #ff3d6e,0 12px 26px #1b133055}
.hero .sub{margin-top:12px;color:#fff;font-size:14px;font-weight:600;text-shadow:0 2px 8px #1b133066}
.bottom{display:flex;flex-direction:column;gap:10px}
.play{position:relative;border:0;border-radius:22px;padding:19px;font-family:var(--disp);font-weight:900;
  font-size:23px;letter-spacing:.03em;color:#1b1330;background:linear-gradient(180deg,#ffe95c,#ffc300);
  box-shadow:0 7px 0 #d19700,0 16px 34px #ff9f1c55;text-transform:uppercase;overflow:hidden}
.play:active{transform:translateY(4px);box-shadow:0 3px 0 #d19700}
.play::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:38%;transform:skewX(-20deg);
  background:linear-gradient(90deg,#fff0,#ffffffcc,#fff0);animation:shine 3.2s infinite}
@keyframes shine{0%,64%{left:-60%}100%{left:130%}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{position:relative;border:0;background:var(--card);color:var(--ink);border-radius:18px;padding:12px 8px;
  font-family:var(--body);font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px;
  box-shadow:0 5px 0 #1b13301a;text-align:left}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1b13301a}
.btn i{font-style:normal;font-size:21px;flex:none;width:34px;height:34px;border-radius:11px;
  display:grid;place-items:center;background:#1b13300d}
.btn u{display:block;text-decoration:none;font-size:11px;color:var(--dim);font-weight:600}
.dot{position:absolute;right:9px;top:9px;width:9px;height:9px;border-radius:50%;background:var(--hot);
  box-shadow:0 0 0 3px #ff3d6e33}

#sheet{position:fixed;inset:0;z-index:8;display:none;background:#1b133066;backdrop-filter:blur(4px)}
#sheet.on{display:block}
.sheetbox{position:absolute;left:0;right:0;bottom:0;max-height:82%;overflow-y:auto;
  -webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;background:var(--paper);
  border-radius:28px 28px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 20px);
  animation:up .3s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheetbox h2{font-family:var(--disp);font-size:20px;text-transform:uppercase;margin-bottom:3px}
.sheetbox .lead{color:var(--dim);font-size:13px;margin-bottom:15px}
.sec{font-family:var(--disp);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  margin:16px 2px 9px}
.sec:first-of-type{margin-top:0}
.item{display:flex;gap:11px;align-items:center;border-radius:18px;padding:12px;margin-bottom:9px;
  background:#1b13300a}
.item.locked{opacity:.6}
.item .ic{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:23px;
  background:#fff;box-shadow:0 3px 0 #1b133014}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-size:15px}
.item .txt span{font-size:12px;color:var(--dim)}
.bar{height:6px;border-radius:3px;background:#1b133014;margin-top:7px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acid),var(--hot));border-radius:3px}
.buy{border:0;border-radius:13px;padding:10px 13px;font-family:var(--body);font-weight:700;font-size:13px;
  background:var(--acid);color:var(--ink);white-space:nowrap;box-shadow:0 4px 0 #d19700}
.buy:active{transform:translateY(2px);box-shadow:0 2px 0 #d19700}
.buy[disabled]{background:#1b13300f;color:#1b133055;box-shadow:none}
.buy.owned{background:var(--mint);color:#04231d;box-shadow:0 4px 0 #00a482}
.close{width:100%;margin-top:6px;border:0;background:#1b13300d;color:var(--ink);border-radius:18px;
  padding:15px;font-family:var(--body);font-weight:700;font-size:15px}

#hud{position:fixed;inset:0;z-index:4;pointer-events:none;display:none;
  padding:calc(env(safe-area-inset-top) + 10px) 12px 12px}
#hud.on{display:block}
.hrow{display:flex;gap:7px;align-items:flex-start}
#clock{font-family:var(--disp);font-size:24px;font-weight:900;background:var(--card);border-radius:16px;
  padding:6px 13px;box-shadow:0 4px 0 #1b133014}
#clock.low{color:var(--hot);animation:pulse .55s infinite}
@keyframes pulse{50%{opacity:.5}}
#wt{font-family:var(--disp);font-size:19px;font-weight:900}
#wt small{font-size:11px;color:var(--dim);font-weight:500}
#lives{font-size:13px;letter-spacing:2px;padding:8px 10px;color:#ff3d6e}
#lives.low{animation:pulse .6s infinite}
#stars{font-size:13px;color:#ffb100;letter-spacing:1px;padding:8px 10px}
#stars.max{animation:pulse .7s infinite}
#exit{pointer-events:auto;border:0;background:var(--card);border-radius:14px;width:38px;height:38px;
  font-size:17px;box-shadow:0 4px 0 #1b133014}
#tier{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 56px);z-index:4;background:var(--card);
  border-radius:14px;padding:6px 11px;box-shadow:0 3px 0 #1b133014;font-size:11px;font-weight:700;display:none;
  opacity:.94}
#tier b{font-family:var(--disp);font-size:12px;margin-right:6px}
#tier .nx{color:var(--dim);font-weight:600;font-size:11px}
#tier .pbar{height:4px;border-radius:2px;background:#1b133014;margin-top:5px;width:132px;overflow:hidden}
#tier .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--acid))}
#combo{position:fixed;left:0;right:0;top:22vh;text-align:center;z-index:4;pointer-events:none;
  font-family:var(--disp);font-weight:900;font-size:clamp(30px,10vw,54px);color:#fff;opacity:0;
  text-shadow:0 3px 0 #ff9f1c,0 6px 0 #ff3d6e,0 10px 30px #1b133066}
#combo.small{font-size:clamp(19px,6vw,30px);line-height:1.15;padding:0 18px}
#combo.bad{text-shadow:0 3px 0 #c9184a,0 6px 0 #7a0d2c,0 10px 30px #1b133066}
#combo.pop{animation:cpop .55s ease-out}
@keyframes cpop{0%{opacity:0;transform:scale(.5) rotate(-8deg)}28%{opacity:1;transform:scale(1.16) rotate(4deg)}100%{opacity:0;transform:scale(1.02)}}
#buffs{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:4;display:flex;gap:7px}
#mini{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 56px);width:64px;height:64px;z-index:4;
  border-radius:14px;background:#ffffffb0;box-shadow:0 3px 0 #1b133014;display:none;opacity:.9}
#dash{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:6;display:none;
  width:82px;height:82px;border:0;border-radius:50%;font-size:32px;font-family:var(--disp);
  background:radial-gradient(circle at 50% 34%,#ff8a5c,#ff3d6e);color:#fff;
  box-shadow:0 7px 0 #c9184a,0 12px 30px #ff3d6e55}
#dash:active{transform:translateY(4px);box-shadow:0 3px 0 #c9184a}
#dash.cool{background:#1b133033;box-shadow:0 5px 0 #1b133022;color:#ffffffaa}
#handhint{position:fixed;right:106px;bottom:calc(env(safe-area-inset-bottom) + 30px);z-index:6;display:none;
  background:var(--card);border-radius:16px;padding:9px 12px;font-size:12px;font-weight:700;line-height:1.35;
  box-shadow:0 5px 0 #1b133014;text-align:right;transition:opacity .5s}
#handhint span{font-weight:500;color:var(--dim);font-size:11px}
#handhint::after{content:"";position:absolute;right:-7px;bottom:22px;border:7px solid transparent;
  border-left-color:#fff}
#tip{position:fixed;left:0;right:0;bottom:30%;text-align:center;z-index:4;color:#fff;font-size:15px;
  font-weight:600;text-shadow:0 2px 10px #1b133088;transition:opacity .5s;display:none}
#flashfx{position:fixed;inset:0;z-index:3;pointer-events:none;background:#ff3d6e;opacity:0;
  transition:opacity .25s}
#rush{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(120% 80% at 50% 50%,#0000 45%,#ffd60a55 100%)}

#res.busted{background:linear-gradient(160deg,#3a4560,#5a6c8a 45%,#2b3346)}
#res.busted .big{text-shadow:0 5px 0 #1b2233,0 14px 34px #1b133055}
#res{background:linear-gradient(160deg,#ffd60a,#ff9f1c 45%,#ff3d6e);align-items:center;justify-content:center;
  padding:24px 18px;text-align:center;gap:4px}
#res .t{font-family:var(--disp);font-size:12px;letter-spacing:.3em;color:#ffffffcc;text-transform:uppercase}
#res .big{font-family:var(--disp);font-weight:900;font-size:clamp(56px,21vw,100px);line-height:1;color:#fff;
  text-shadow:0 5px 0 #c9184a,0 14px 34px #1b133055}
#res .unit{font-family:var(--disp);font-size:17px;color:#fff}
#res .rank{font-family:var(--disp);font-size:18px;margin-top:12px;background:#fff;color:var(--ink);
  border-radius:999px;padding:9px 20px;box-shadow:0 5px 0 #1b133022}
#res .newrec{color:#fff;font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-top:10px}
#res .stats{display:flex;gap:9px;margin:18px 0 4px;flex-wrap:wrap;justify-content:center}
#res .st{background:#ffffff2e;border-radius:16px;padding:10px 14px;min-width:92px;color:#fff}
#res .st b{display:block;font-family:var(--disp);font-size:18px}
#res .st span{font-size:11px;opacity:.85}
#res .acts{display:flex;flex-wrap:wrap;gap:9px;width:100%;max-width:360px;margin-top:20px}
#res .acts .play{flex:1 1 100%}
#res .acts .btn{flex:1 1 0;min-width:0;justify-content:center}
#toast{position:fixed;left:50%;top:13%;transform:translateX(-50%);z-index:20;display:none;background:#fff;
  color:var(--ink);font-weight:700;font-size:14px;padding:11px 17px;border-radius:15px;
  box-shadow:0 7px 0 #1b133022;white-space:nowrap}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="flashfx"></div><div id="rush"></div>

<div id="intro">
  <video id="introVid" src="assets/video/intro.mp4" muted playsinline preload="auto" disablepictureinpicture></video>
  <button id="skip">Пропустить ▸</button>
</div>

<div id="load">
  <div class="face"><img id="loadFace" alt=""></div>
  <div class="ttl">Голодный</div>
  <div class="track"><i id="loadBar"></i></div>
  <div class="st" id="loadSt">загружаем район…</div>
</div>

<div class="screen" id="menu">
  <div class="top">
    <div class="pill">🪙 <b id="coins">0</b></div>
    <div class="pill">🏆 <b id="best">0</b> кг</div>
    <div class="spacer"></div>
    <div class="pill" id="muteBtn">🔊</div>
  </div>
  <div class="hero">
    <div class="kicker">сожри район</div>
    <h1>Голодный</h1>
    <div class="sub">Ешь мелочь → машины → дома. Убегай от ППС.</div>
  </div>
  <div class="bottom">
    <button class="play" id="playBtn">Играть</button>
    <div class="grid">
      <button class="btn" id="shopBtn"><i>🛒</i><span>Магазин<u id="shopHint">прокачка и скины</u></span></button>
      <button class="btn" id="misBtn"><span class="dot" id="misDot"></span><i>🎯</i><span>Задания<u id="misHint">0/3</u></span></button>
    </div>
  </div>
</div>

<div id="sheet"><div class="sheetbox">
  <h2 id="shTitle"></h2><div class="lead" id="shLead"></div>
  <div id="shBody"></div>
  <button class="close" id="shClose">Закрыть</button>
</div></div>

<div id="hud">
  <div class="hrow">
    <div id="clock">1:40</div>
    <div class="pill"><span id="wt">62<small> кг</small></span></div>
    <div class="pill" id="lives">❤️❤️❤️</div>
    <div class="pill" id="stars">★</div>
    <div class="spacer"></div>
    <button id="exit">✕</button>
  </div>
</div>
<div id="tier"><b id="tierName">мелочь</b><span class="nx" id="tierNext">до тачек: 8 кг</span>
  <div class="pbar"><i id="tierBar"></i></div></div>
<div id="combo"></div>
<div id="buffs"></div>
<canvas id="mini" width="64" height="64"></canvas>
<div id="handhint">🙌 удобнее <b>двумя руками</b><br><span>левая ведёт · правая жмёт 💨</span></div>
<button id="dash">💨</button>
<div id="tip"></div>

<div class="screen" id="res">
  <div class="t" id="resTop">сожрал</div>
  <div class="big" id="resKg">0</div>
  <div class="unit" id="resUnit">килограммов</div>
  <div class="rank" id="resRank"></div>
  <div class="newrec" id="resRec" style="visibility:hidden">новый рекорд!</div>
  <div class="stats">
    <div class="st"><b id="resCnt">0</b><span>объектов</span></div>
    <div class="st"><b id="resHouse">0</b><span>домов</span></div>
    <div class="st"><b id="resCoin">0</b><span>монет 🪙</span></div>
  </div>
  <div class="acts">
    <button class="play" id="againBtn">Ещё разок</button>
    <button class="btn" id="shareBtn"><i>📣</i>Хвастаться</button>
    <button class="btn" id="menuBtn"><i>🏠</i>В меню</button>
  </div>
</div>

<div id="toast"></div>

<script>__THREE__</script>
<script>__LOADER__</script>
<script>
const FACE_SRC = "__FACE__";
document.getElementById("loadFace").src = FACE_SRC;
const TG = window.Telegram && window.Telegram.WebApp;
if (TG){
  TG.ready(); TG.expand();
  TG.disableVerticalSwipes && TG.disableVerticalSwipes();
  TG.setHeaderColor && TG.setHeaderColor("#8fd4ff");
  TG.setBackgroundColor && TG.setBackgroundColor("#8fd4ff");
}
const haptic = t => { try{ TG && TG.HapticFeedback.impactOccurred(t); }catch(e){} };
const $ = id => document.getElementById(id);
document.addEventListener("touchmove", e=>{
  if(e.target && e.target.closest && e.target.closest(".sheetbox")) return;
  if(e.cancelable) e.preventDefault();
}, {passive:false});

/* ================== сохранёнка ================== */
const DEF = { coins:0, best:0, xp:0, up:{speed:0,magnet:0,appetite:0}, skin:0, owned:[0],
              zone:0, zones:[0], day:"", mis:null, mute:false };
let S = Object.assign({}, DEF, JSON.parse(localStorage.getItem("hungry3")||"{}"));
S.up = Object.assign({}, DEF.up, S.up);
const save = ()=> localStorage.setItem("hungry3", JSON.stringify(S));

const UPS = [
  { k:"speed",    ic:"👟", name:"Кроссы Абибас", desc:"бегает быстрее",          max:5, cost:l=>60+l*70 },
  { k:"magnet",   ic:"🧲", name:"Нюх на еду",    desc:"еда сама летит в рот",    max:5, cost:l=>90+l*110 },
  { k:"appetite", ic:"🍽", name:"Батин аппетит", desc:"больше кг с каждой цели", max:5, cost:l=>80+l*90 },
];
const SKINS = [
  { name:"Обычный",  ic:"😋", cost:0,    glow:0xffd60a, tint:0xffffff, emis:0x000000, ei:0,
    metal:.0,  rough:.75, ring:0,        fire:false, desc:"как есть" },
  { name:"Золотой",  ic:"👑", cost:600,  glow:0xffc300, tint:0xffdf9e, emis:0x4a3000, ei:.5,
    metal:.5,  rough:.3,  ring:0xffd700, fire:false, desc:"золотой блеск и кольцо" },
  { name:"Неоновый", ic:"⚡", cost:1500, glow:0x00ffd0, tint:0x8ff7e6, emis:0x006b56, ei:.75,
    metal:.25, rough:.4,  ring:0x00ffd0, fire:false, desc:"неоновое свечение" },
  { name:"Адский",   ic:"🔥", cost:3000, glow:0xff3d00, tint:0xffa285, emis:0x6e1000, ei:.8,
    metal:.35, rough:.35, ring:0xff4500, fire:true, desc:"горит и сыплет искры" },
];
const ZONES = [
  { name:"Спальник",   ic:"🏢", cost:0,    mult:1,    cops:2, sky:["#8fd4ff","#dff4ff"],
    grass:0x74c247, houses:"sub", trees:["default","oak","fat"] },
  { name:"Центр",      ic:"🌆", cost:1200, mult:1.25, cops:3, sky:["#ffa46b","#ffe0b0"],
    grass:0x63b04a, houses:"com", trees:["default","pineRoundA"] },
  { name:"Набережная", ic:"🌴", cost:3500, mult:1.55, cops:4, sky:["#49b6ff","#b8f2ff"],
    grass:0x49c47e, houses:"mix", trees:["palmTall","palmTall","oak"] },
];
const lvlOf = xp => 1 + Math.floor(Math.sqrt(xp/60));

/* ================== мир ================== */
const TINY = location.search.indexOf("tiny=1")>=0;
const COLS=TINY?3:7, ROWS=TINY?3:7, BLOCK=300, ROAD=118;
const W = COLS*(BLOCK+ROAD)+ROAD, H = ROWS*(BLOCK+ROAD)+ROAD;
const ROUND = 100, RUSH = 15, R0 = 15;

const TIERS = [
  { r:0,  name:"мелочь",  eat:"еда, деревья, урны" },
  { r:25, name:"тачки",   eat:"машины и фонари" },
  { r:42, name:"домики",  eat:"низкие дома" },

const SFX = (()=>{
  let AC=null, master=null, musicOn=false, musicTimer=null, sirenOsc=null, sirenGain=null;
  function ctx(){
    if(!AC){
      AC = new (window.AudioContext||window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value=.5; master.connect(AC.destination);
    }
    if(AC.state==="suspended") AC.resume();
    return AC;
  }
  function tone(freq,dur,type,vol,slide){
    if(S.mute) return;
    const a=ctx(), o=a.createOscillator(), g=a.createGain();
    o.type=type||"triangle"; o.frequency.setValueAtTime(freq,a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),a.currentTime+dur);
    g.gain.setValueAtTime(vol||.16,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(a.currentTime+dur+.02);
  }
  function noise(dur,vol,filt){
    if(S.mute) return;
    const a=ctx(), n=(a.sampleRate*dur)|0, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const src=a.createBufferSource(); src.buffer=buf;
    const f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.value=filt||900;
    const g=a.createGain(); g.gain.value=vol||.3;
    src.connect(f); f.connect(g); g.connect(master); src.start();
  }
  const SCALE=[0,3,5,7,10];
  function startMusic(){
    if(musicOn||S.mute) return;
    musicOn=true; ctx(); let stp=0;
    musicTimer=setInterval(()=>{
      if(S.mute) return;
      const base=110*Math.pow(2,(stp%16<8?0:2)/12);
      if(stp%2===0) tone(base/2,.28,"sine",.12);
      tone(base*2*Math.pow(2,SCALE[(stp*3)%SCALE.length]/12),.16,"triangle",.05);
      if(stp%4===0) noise(.05,.05,2400);
      stp++;
    },250);
  }
  function stopMusic(){ musicOn=false; clearInterval(musicTimer); }
  function siren(on){
    if(S.mute||!on) return;
    const a=ctx();
    if(!sirenOsc){
      sirenOsc=a.createOscillator(); sirenOsc.type="sawtooth"; sirenOsc.frequency.value=560;
      sirenGain=a.createGain(); sirenGain.gain.value=0;
      const lfo=a.createOscillator(); lfo.frequency.value=2.4;
      const lg=a.createGain(); lg.gain.value=120;
      lfo.connect(lg); lg.connect(sirenOsc.frequency); lfo.start();
      const f=a.createBiquadFilter(); f.type="lowpass"; f.frequency.value=1400;
      sirenOsc.connect(f); f.connect(sirenGain); sirenGain.connect(master); sirenOsc.start();
    }
  }
  function sirenLevel(v){ if(sirenGain) sirenGain.gain.value = S.mute?0:clamp(v,0,1)*.07; }
  return {
    ctx, startMusic, stopMusic, siren, sirenLevel,
    eat(combo){ tone(240+Math.min(combo,16)*30,.09,"triangle",.16,130); },
    crush(){ noise(.5,.5,420); tone(70,.5,"sine",.3,38); },
    car(){ noise(.28,.34,700); tone(140,.28,"square",.12,60); },
    dash(){ tone(300,.22,"sawtooth",.12,900); noise(.2,.15,2000); },
    hit(){ tone(95,.4,"square",.2,45); noise(.3,.3,500); },
    gold(){ [660,880,1320].forEach((f,i)=>setTimeout(()=>tone(f,.16,"triangle",.14),i*70)); },
    buy(){ tone(720,.1,"triangle",.14,980); },
    tick(){ tone(1150,.05,"square",.07); },
    burp(){ tone(140,.34,"sawtooth",.2,58); noise(.22,.14,420); },
    end(){ [880,660,440].forEach((f,i)=>setTimeout(()=>tone(f,.3,"triangle",.16),i*140)); }
  };
})();

function normalize(obj,targetH,byMax){
  const box=new THREE.Box3().setFromObject(obj), size=box.getSize(new THREE.Vector3());
  const base = byMax ? Math.max(size.x,size.y,size.z) : size.y;
  const k=targetH/(base||1), g=new THREE.Group();
  obj.scale.setScalar(k);
  obj.position.set(-(box.min.x+size.x/2)*k, -box.min.y*k, -(box.min.z+size.z/2)*k);
  g.add(obj);
  g.userData.size=new THREE.Vector3(size.x*k,size.y*k,size.z*k);
  return g;
}
const VARI = { sub:[], com:[] };
/* готовые перекрашенные палитры кита — дома получаются разноцветными */
function loadVariations(){
  const tl=new THREE.TextureLoader(), jobs=[];
  ["sub","com"].forEach(kit=>{
    for(let i=1;i<=5;i++) jobs.push(new Promise(res=>{
      tl.load("assets/"+kit+"/Textures/pal"+i+".png", t=>{
        t.flipY=false; t.encoding=THREE.sRGBEncoding; t.anisotropy=MAXA;
        VARI[kit].push(t); res();
      }, undefined, ()=>res());
    }));
  });
  return Promise.all(jobs);
}
function loadAll(onProg){
  const loader=new THREE.GLTFLoader();
  const varsP = loadVariations();
  let done=0;
  return Promise.all([varsP].concat(ASSETS.map(([key,url])=>new Promise(res=>{
    loader.load(url, gltf=>{
      gltf.scene.traverse(o=>{
        if(o.isMesh){
          o.castShadow=!LOWSPEC; o.receiveShadow=!LOWSPEC;
          if(o.material&&o.material.map) o.material.map.anisotropy=MAXA;
        }
      });
      MODELS[key]=gltf.scene; onProg(++done/ASSETS.length); res();
    }, undefined, ()=>{ onProg(++done/ASSETS.length); res(); });
  }))));
}

function inst(key,targetH,tint,byMax){
  const src=MODELS[key];
  if(!src){
    const m=new THREE.Mesh(new THREE.BoxGeometry(targetH*.8,targetH,targetH*.8),
      new THREE.MeshLambertMaterial({ color:0xcfd6e0 }));
    m.position.y=targetH/2; m.castShadow=!LOWSPEC;
    const g=new THREE.Group(); g.add(m);
    g.userData.size=new THREE.Vector3(targetH*.8,targetH,targetH*.8); return g;
  }
  const cl = src.clone(true);
  if(tint){                                   // своя палитра — чтобы дома не были близнецами
    cl.traverse(o=>{
      if(o.isMesh && o.material && o.material.map){
        o.material = o.material.clone();
        o.material.map = tint;
      }
    });
  }
  return normalize(cl,targetH,byMax);
}

function input(){
  let dx=0,dy=0;
  if(keys.a||keys.arrowleft)dx-=1; if(keys.d||keys.arrowright)dx+=1;
  if(keys.w||keys.arrowup)dy-=1;   if(keys.s||keys.arrowdown)dy+=1;

  if(l>0) return {x:dx/l,y:dy/l,p:1};
  if(stick){
    l=Math.hypot(stick.dx,stick.dy);
    if(l>DEAD) return {x:stick.dx/l,y:stick.dy/l,p:clamp((l-DEAD)/(MAXR-DEAD),0,1)};
  }
  return {x:0,y:0,p:0};
}

/* ================== шаг ================== */
function step(dt){
  const d=input(), dashing=G.dash>0;
  const speed=190*G.spd*Math.pow(R0/G.r,.3)*(dashing?3.0:1);
  const acc=dashing?26:10;
  if(!(dashing&&d.p<.1)){
    G.vx+=(d.x*speed*d.p-G.vx)*Math.min(1,dt*acc);
    G.vz+=(d.y*speed*d.p-G.vz)*Math.min(1,dt*acc);
  }
  if(dashing){ const l=Math.hypot(G.vx,G.vz)||1; G.vx=G.vx/l*speed; G.vz=G.vz/l*speed; }
  player.position.x=clamp(player.position.x+G.vx*dt,G.r,W-G.r);
  player.position.z=clamp(player.position.z+G.vz*dt,G.r,H-G.r);
  G.dash=Math.max(0,G.dash-dt); G.dashCd=Math.max(0,G.dashCd-dt); G.inv=Math.max(0,G.inv-dt);

  const sq=G.squash;                                    // смешно чавкает: сплющился и обратно
  body.scale.set(G.r*(1+G.punch+sq*.5), G.r*(1+G.punch-sq*.6), G.r*(1+G.punch+sq*.5));
  G.squash += (0-G.squash)*Math.min(1,dt*7);
  body.visible=!(G.inv>0&&Math.sin(G.inv*30)>0);
  halo.scale.set(G.r*7,G.r*7,1);
  if(skinRing.visible){
    skinRing.scale.setScalar(G.r*1.22);
    skinRing.rotation.z+=dt*1.5;
  }
  if(SKINS[S.skin].fire && Math.random()<dt*14){        // адский скин искрит на бегу
    burst(player.position.x+rnd(-G.r,G.r), player.position.z+rnd(-G.r,G.r), 0xff5a00, 1, 40, G.r);
  }
  G.punch=Math.max(0,G.punch-dt*2.6);
  const v=Math.hypot(G.vx,G.vz);
  G.spin+=dt*(0.9+v/G.r*1.5)*(G.chew>0?4:1);
  body.rotation.y=-G.spin; body.rotation.x=Math.sin(G.spin*2)*.06;
  player.position.y=G.r+Math.abs(Math.sin(G.spin*3))*G.r*.05;
  G.chew=Math.max(0,G.chew-dt);

  const px=player.position.x, pz=player.position.z;
  const magR=26+S.up.magnet*24;

  for(const o of props){
    if(!o.alive) continue;
    if(o.suck>0){
      o.suck+=dt*3.2;
      o.g.scale.setScalar(Math.max(.001,1-o.suck));
      o.g.position.x+=(px-o.g.position.x)*Math.min(1,dt*9);
      o.g.position.z+=(pz-o.g.position.z)*Math.min(1,dt*9);
      o.g.position.y=Math.sin(o.suck*2)*G.r*.4;
      o.g.rotation.y+=dt*7;
      if(o.suck>=1){ o.alive=false; o.g.visible=false; }
      continue;
    }
    const dx=px-o.x, dz=pz-o.z, dist=Math.hypot(dx,dz);
    if(dist>G.r+o.r+20) continue;
    if(dist<G.r+o.r*.55){
      if(o.tier<=G.tier||dashing) eatProp(o);
      else {                                   // не по зубам — выталкиваем и скользим вдоль, без дрожи
        const l=dist||1, nx=dx/l, nz=dz/l;
        const overlap=(G.r+o.r*.55)-dist;
        player.position.x+=nx*overlap; player.position.z+=nz*overlap;
        const vn=G.vx*nx+G.vz*nz;
        if(vn<0){ G.vx-=vn*nx; G.vz-=vn*nz; }  // гасим только движение «в стену»
      }
    }
  }

  for(const o of spots){
    if(!o.alive) continue;
    o.t+=dt;
    o.food.rotation.y+=dt*1.6;
    o.food.position.y=33+Math.sin(o.t*2.6)*3;
    o.ring.material.opacity=.28+Math.sin(o.t*3.4)*.16;
    if(o.gold){ o.life-=dt; if(o.life<=0){ o.alive=false; o.g.visible=false; continue; } }
    const dx=px-o.x, dz=pz-o.z, dist=Math.hypot(dx,dz)||1;
    if(magR>0&&dist<magR+G.r){
      const pull=300*dt*(1-dist/(magR+G.r));
      o.x+=dx/dist*pull; o.z+=dz/dist*pull; o.g.position.set(o.x,0,o.z);
    }
    if(dist<G.r+18) eatSpot(o);
  }

  let nearestCop=1e9;
  for(const c of cops){
    if(!c.g.visible||G.busted) continue;
    const blink=Math.sin(performance.now()/110)>0;
    c.l1.material.color.setHex(blink?0xff3d6e:0x5a1220);
    c.l2.material.color.setHex(blink?0x14224a:0x2b6cff);
    const dx=px-c.x, dz=pz-c.z, l=Math.hypot(dx,dz)||1;
    nearestCop=Math.min(nearestCop,l);
    if(c.stun>0){ c.stun-=dt; c.g.position.y=Math.sin(c.stun*30)*4; continue; }
    c.g.position.y=0; c.cd=Math.max(0,c.cd-dt);
    const cs=104+G.eaten*.45+(ROUND-G.t)*.45;
    if(c.atk>0){
      c.atk-=dt; c.x+=c.ax*dt; c.z+=c.az*dt;
      if(c.atk<=0){ c.stun=1.1; c.vx=c.vz=0; c.cd=2.2; }
    } else if(c.charge>0){
      c.charge-=dt; c.vx*=.86; c.vz*=.86; c.x+=c.vx*dt; c.z+=c.vz*dt;
      c.g.scale.setScalar(1+Math.sin(c.charge*40)*.06);
      if(c.charge<=0){ c.ax=dx/l*450; c.az=dz/l*450; c.atk=.5; c.g.scale.setScalar(1); SFX.hit(); }
    } else {
      if(l<300&&c.cd<=0&&G.t<ROUND-12){ c.charge=.65; haptic("light"); }
      c.vx+=((dx/l*cs)-c.vx)*Math.min(1,dt*2.2);
      c.vz+=((dz/l*cs)-c.vz)*Math.min(1,dt*2.2);
      c.x+=c.vx*dt; c.z+=c.vz*dt;
    }
    c.x=clamp(c.x,20,W-20); c.z=clamp(c.z,20,H-20);
    c.g.position.set(c.x,c.g.position.y,c.z);
    c.g.rotation.y=Math.atan2(dx,dz)+Math.PI/2;
    if(l<G.r+20){
      if(G.tier>=3||G.dash>0){
        G.kg+=30*G.app; G.eaten++; G.punch=.2; shake=Math.max(shake,16);
        burst(c.x,c.z,0x2b6cff,16,180,20); SFX.car(); haptic("heavy");
        flash("🚓 сожрал ППСника"); missionProgress("cop",1,true); placeCop(c); setWeight();
      } else if(G.inv<=0){
        c.stun=2; hitPlayer("ПОЙМАЛИ!", -dx, -dz);
        if(G.busted) return;
      }
    }
  }
  SFX.sirenLevel(nearestCop<700?(1-nearestCop/700)*(.4+G.tier*.2):0);

  /* ---------- уровень розыска ---------- */
  const st=starsOf(G.kg);
  if(st>G.stars){
    G.stars=st;
    const w=WANTED[st];
    bigText("★".repeat(st+1)+" "+w.name);
    flash("🚨 розыск "+(st+1)+"★ — "+w.hint);
    SFX.gold(); shake=Math.max(shake,16); setStars();
    if(st>=1 && cops.filter(c=>c.g.visible).length<G.zone.cops+2)
      placeCop(cops.find(c=>!c.g.visible)||newCop());
    if(st>=2 && !heli.alive){ heli.alive=true; heli.g.visible=true; heli.ang=0; heli.cd=3; }
    if(st>=3 && !tank.alive){
      tank.alive=true; tank.g.visible=true; tank.cd=3;
      tank.x=clamp(px+rnd(-500,500),40,W-40); tank.z=clamp(pz+rnd(-500,500),40,H-40);
      tank.g.position.set(tank.x,0,tank.z);
    }
    if(st>=4 && !ufo.alive){ ufo.alive=true; ufo.g.visible=true; ufo.cd=3; ufo.x=px; ufo.z=pz; }
  }

  /* вертолёт: кружит и сбрасывает мешки */
  if(heli.alive){
    heli.ang+=dt*.62;
    const R=190;
    heli.x+=((px+Math.cos(heli.ang)*R)-heli.x)*Math.min(1,dt*1.5);
    heli.z+=((pz+Math.sin(heli.ang)*R)-heli.z)*Math.min(1,dt*1.5);
    heli.g.position.set(heli.x,150,heli.z);
    heli.g.rotation.y=-heli.ang+Math.PI/2;
    heli.rotor.rotation.y+=dt*26;
    heli.tailRotor.rotation.x+=dt*30;
    heli.cd-=dt;
    if(heli.cd<=0 && G.atkCd<=0){ heli.cd=4.2; G.atkCd=2.2; newBomb(px+G.vx*.35, pz+G.vz*.35, 1.25); SFX.tick(); }
  }
  for(let i=bombs.length-1;i>=0;i--){
    const b=bombs[i]; b.t-=dt;
    b.ring.scale.setScalar(.6+ (1.3-b.t)*.5);
    b.ring.material.opacity=.4+Math.abs(Math.sin(b.t*14))*.45;
    if(b.t<=0){
      burst(b.x,b.z,b.laser?0x8affd6:0xff3d6e,14,180,14); SFX.crush(); shake=Math.max(shake,14);
      if(Math.hypot(px-b.x,pz-b.z) < 44+G.r*.14)
        hitPlayer(b.laser?"ЛУЧ НЛО!":"МЕШОК СВЕРХУ!", px-b.x, pz-b.z);
      scene.remove(b.ring); bombs.splice(i,1);
    }
  }

  /* танк: едет и стреляет */
  if(tank.alive){
    const dx=px-tank.x, dz=pz-tank.z, l=Math.hypot(dx,dz)||1;
    if(l>210){
      tank.vx+=((dx/l*92)-tank.vx)*Math.min(1,dt*1.4);
      tank.vz+=((dz/l*92)-tank.vz)*Math.min(1,dt*1.4);
    } else { tank.vx*=.9; tank.vz*=.9; }
    tank.x=clamp(tank.x+tank.vx*dt,30,W-30); tank.z=clamp(tank.z+tank.vz*dt,30,H-30);
    tank.g.position.set(tank.x,0,tank.z);
    tank.g.rotation.y=Math.atan2(tank.vx,tank.vz)-Math.PI/2;
    tank.turret.rotation.y=Math.atan2(dz,dx)-tank.g.rotation.y;
    tank.cd-=dt;
    if(tank.cd<=0 && l<620 && G.atkCd<=0){ tank.cd=4; G.atkCd=2.2; newShell(tank.x,tank.z,px+G.vx*.3,pz+G.vz*.3); SFX.hit(); }
    if(l < G.r+26){
      if(G.r>95){ G.kg+=180*G.app; G.eaten++; shake=Math.max(shake,20); burst(tank.x,tank.z,0x5d6b4a,18,200,20);
        SFX.crush(); flash("🪖 СОЖРАЛ ТАНК"); tank.alive=false; tank.g.visible=false; setWeight(); }
      else hitPlayer("ТАНК ПРОТАРАНИЛ!", -dx, -dz);
      if(G.busted) return;
    }
  }
  for(let i=shells.length-1;i>=0;i--){
    const s=shells[i]; s.life-=dt;
    s.m.position.x+=s.vx*dt; s.m.position.z+=s.vz*dt;
    if(Math.hypot(px-s.m.position.x,pz-s.m.position.z) < G.r*.7+8){
      burst(s.m.position.x,s.m.position.z,0xffb100,10,150,16);
      hitPlayer("СНАРЯД!", px-s.m.position.x, pz-s.m.position.z);
      scene.remove(s.m); shells.splice(i,1);
      if(G.busted) return;
      continue;
    }
    if(s.life<=0){ scene.remove(s.m); shells.splice(i,1); }
  }

  /* метеоритный дождь — когда за тобой уже вся галактика */
  if(G.stars>=4){
    G.meteorT-=dt;
    if(G.meteorT<=0){
      G.meteorT=11;
      const n=3+((Math.random()*3)|0);
      for(let i=0;i<n;i++) newMeteor(px+rnd(-320,320), pz+rnd(-320,320));
      flash("☄️ МЕТЕОРИТЫ!"); SFX.tick();
    }
  }
  for(let i=meteors.length-1;i>=0;i--){
    const mt=meteors[i]; mt.t-=dt;
    mt.m.position.y = Math.max(10, 620*(mt.t/1.6)*(mt.t/1.6));
    mt.m.rotation.x+=dt*5; mt.m.rotation.z+=dt*4;
    mt.ring.material.opacity=.35+Math.abs(Math.sin(mt.t*12))*.5;
    mt.ring.scale.setScalar(.7+(1.6-mt.t)*.35);
    if(mt.t<=0){
      burst(mt.x,mt.z,0xff6a00,18,220,16); SFX.crush(); shake=Math.max(shake,20);
      for(const o of props){                       // метеорит сносит всё вокруг
        if(!o.alive||o.suck>0) continue;
        if(Math.hypot(o.x-mt.x,o.z-mt.z)<74){ o.suck=.01; }
      }
      if(Math.hypot(px-mt.x,pz-mt.z) < 60+G.r*.15) hitPlayer("МЕТЕОРИТ!", px-mt.x, pz-mt.z);
      scene.remove(mt.m); scene.remove(mt.ring); meteors.splice(i,1);
      if(G.busted) return;
    }
  }

  /* НЛО: висит сверху, тянет лучом и бьёт */
  if(ufo.alive){
    ufo.x+=(px-ufo.x)*Math.min(1,dt*1.1);
    ufo.z+=(pz-ufo.z)*Math.min(1,dt*1.1);
    ufo.g.position.set(ufo.x,132,ufo.z);
    ufo.g.rotation.y+=dt*1.2;
    const near=Math.hypot(px-ufo.x,pz-ufo.z)<70;
    ufo.beam.material.opacity=near?.3:.14;
    if(near){ G.vx*=.985; G.vz*=.985; }              // луч тормозит
    ufo.cd-=dt;
    if(ufo.cd<=0 && G.atkCd<=0){ ufo.cd=5.6; G.atkCd=2.2; newBomb(px+G.vx*.4, pz+G.vz*.4, 1.1, true); }
    if(G.busted) return;
  }

  G.atkCd=Math.max(0,G.atkCd-dt);
  G.calm+=dt;                                    // не били 18 секунд — сердце возвращается
  if(G.calm>18 && G.lives<(G.maxLives||5)){ G.calm=0; G.lives++; setLives(); flash("❤ восстановил сердце"); }
  G.copT-=dt;
  if(G.copT<=0&&cops.filter(c=>c.g.visible).length<G.zone.cops+3){
    G.copT=32; placeCop(cops.find(c=>!c.g.visible)||newCop());
    flash("🚓 приехало подкрепление!"); SFX.hit();
  }
  G.goldT-=dt;
  if(G.goldT<=0){
    G.goldT=28; placeSpot(spots.find(s=>!s.alive)||newSpot(),true);
    flash("🏆 ЗОЛОТАЯ ЖРАТВА! 10 секунд"); SFX.gold();
  }
  if(G.comboT>0){ G.comboT-=dt; if(G.comboT<=0){ G.combo=0; G.mult=1; } }

  const want=150+G.r*5.4;
  G.camD+=(want-G.camD)*Math.min(1,dt*2);
  shake=Math.max(0,shake-dt*34);
  const sx=shake?rnd(-shake,shake):0, sz=shake?rnd(-shake,shake):0;
  cam.position.set(px+sx,G.camD*1.42+sz*.4,pz+G.camD*.62+sz);
  cam.lookAt(px,0,pz-G.r*.25);
  if(!LOWSPEC){ sun.position.set(px-420,700,pz+340); sun.target.position.set(px,0,pz); sun.target.updateMatrixWorld(); }

  const dc=$("dash");
  dc.classList.toggle("cool",G.dashCd>0);
  dc.textContent=G.dashCd>0?Math.ceil(G.dashCd):"💨";

  const prev=G.t; G.t-=dt;
  const s=Math.max(0,G.t);
  $("clock").textContent=Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
  $("clock").classList.toggle("low",s<=10);
  if(Math.ceil(prev)!==Math.ceil(G.t)&&s<=10&&s>0) SFX.tick();
  if(!G.rush&&s<=RUSH){
    G.rush=true; $("rush").style.opacity=1;
    bigText("ЖОР-ТАЙМ x2!"); SFX.gold(); flash("⚡ последние 15 секунд — двойной вес");
  }
  if(G.t<=0) endGame();
  drawMini();
}

function eatProp(o){
  o.suck=.01;
  G.combo++; G.comboT=2.3;
  G.mult=clamp(1+G.combo*.13,1,6);
  if(G.mult>G.bestCombo) G.bestCombo=G.mult;
  G.kg+=o.kg*G.app*G.mult*(G.rush?2:1); G.eaten++;
  G.r=Math.min(135, Math.sqrt(G.r*G.r+o.area*(1+S.up.appetite*.06)));
  G.chew=.4; G.punch=Math.min(.22,.06+o.area/4000);
  G.squash=o.tier>=2?.5:.3; belch();
  if(o.tier>=2){ G.houses++; shake=Math.max(shake,16); SFX.crush(); burst(o.x,o.z,0xd9cdb8,16,190,26);
    popEmo("🏠",o.x,o.z,40); }
  else if(o.tier===1){ SFX.car(); burst(o.x,o.z,0xbfd0e0,10,140,16); popEmo("🚗",o.x,o.z,30); }
  else { SFX.eat(G.combo); burst(o.x,o.z,0x8fd06a,7,110,12); popEmo("🌳",o.x,o.z,26); }
  haptic(o.tier>=2?"heavy":"light");
  setWeight(); updTier();
  if(G.combo>=3) bigText((G.combo%3===0)?pick(MEMES):"x"+G.mult.toFixed(1));
}
function eatSpot(o){
  o.alive=false; o.g.visible=false;
  G.combo++; G.comboT=2.3;
  G.mult=clamp(1+G.combo*.13,1,6);
  if(G.mult>G.bestCombo) G.bestCombo=G.mult;
  const gain=o.kind.kg*G.app*G.mult*(G.rush?2:1);
  G.kg+=gain; G.eaten++;
  G.r=Math.min(135, Math.sqrt(G.r*G.r+o.kind.area*(1+S.up.appetite*.06)));
  G.chew=.45; G.punch=.14;
  burst(o.x,o.z,o.kind.col,o.gold?22:12,o.gold?200:120,26);
  popEmo(o.gold?"🏆":(o.kind.emo||"🍕"), o.x, o.z, 34);
  G.squash=.34; belch();
  SFX.eat(G.combo); haptic("light");
  setWeight(); updTier();
  if(o.gold){ shake=Math.max(shake,18); bigText("🏆 +"+Math.round(gain)+" КГ"); SFX.gold(); missionProgress("gold",1,true); }
  else {
    missionProgress("food",1,true);
    if(G.combo>=3) bigText((G.combo%3===0)?pick(MEMES):"x"+G.mult.toFixed(1));
    setTimeout(()=>{ if(mode==="playing") placeSpot(o); },450);
  }
}

/* ================== эффекты ================== */
function belch(){                                       // каждые несколько укусов — смачное «буэ»
  if(++G.burp < 6) return;
  G.burp=0; G.squash=.6;
  popEmo("💨", player.position.x, player.position.z+G.r*.7, G.r*1.1);
  bigText(pick(["БУРП! 🤢","ЫЫЫХ 😮‍💨","УФФ… 😵","ХОРОШО ПОШЛО 😋"]));
  SFX.burp(); haptic("medium"); shake=Math.max(shake,7);
}
function bigText(txt,bad){
  const c=$("combo"); c.textContent=txt; c.classList.toggle("bad",!!bad);
  c.classList.toggle("small", txt.length>13);
  c.classList.remove("pop"); void c.offsetWidth; c.classList.add("pop");
}
function hitFlash(){ const f=$("flashfx"); f.style.opacity=.45; setTimeout(()=>f.style.opacity=0,120); }
let toastT=0;
function flash(text){
  const t=$("toast"); t.textContent=text; t.style.display="block";
  clearTimeout(toastT); toastT=setTimeout(()=>t.style.display="none",1500);
}
function drawMini(){
  const k=64/Math.max(W,H);
  mctx.clearRect(0,0,64,64);
  mctx.fillStyle="#1b13300f"; mctx.fillRect(0,0,64,64);
  mctx.fillStyle="#00b05577";
  for(const o of props){ if(o.alive&&o.suck<=0&&o.tier<=G.tier) mctx.fillRect(o.x*k-1,o.z*k-1,2,2); }
  for(const o of spots){
    if(!o.alive) continue;
    mctx.fillStyle="#"+o.kind.col.toString(16).padStart(6,"0");
    mctx.fillRect(o.x*k-1.5,o.z*k-1.5,o.gold?5:3,o.gold?5:3);
  }
  mctx.fillStyle="#2b6cff";
  for(const c of cops){ if(c.g.visible) mctx.fillRect(c.x*k-2,c.z*k-2,4,4); }
  mctx.fillStyle="#ff3d6e";
  mctx.beginPath(); mctx.arc(player.position.x*k,player.position.z*k,3.4,0,7); mctx.fill();
}

/* ================== задания ================== */
function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate(); }
function rollMissions(){
  const pool=[
    { id:"food",  txt:"Съесть 25 заведений",     goal:25,  rew:150 },
    { id:"house", txt:"Снести 20 домов",         goal:20,  rew:240 },
    { id:"cop",   txt:"Сожрать 3 ППСников",      goal:3,   rew:280 },
    { id:"gold",  txt:"Поймать 2 золотых",       goal:2,   rew:260 },
    { id:"kg",    txt:"Набрать 5000 кг за раунд",goal:5000,rew:220 },
    { id:"combo", txt:"Разогнать комбо до x4",   goal:4,   rew:200 },
  ].sort(()=>Math.random()-.5).slice(0,3);
  S.mis=pool.map(m=>Object.assign({p:0,done:false},m));
}
function checkDay(){
  if(S.day!==todayKey()){
    S.day=todayKey(); rollMissions(); S.coins+=100; save();
    setTimeout(()=>flash("🎁 Ежедневный бонус +100 🪙"),900);
  }
  if(!S.mis) rollMissions();
}
function missionProgress(id,val,add){
  if(!S.mis) return;
  let ch=false;
  for(const m of S.mis){
    if(m.id!==id||m.done) continue;
    m.p=add?m.p+val:Math.max(m.p,val);
    if(m.p>=m.goal){ m.done=true; S.coins+=m.rew; ch=true; flash("🎯 Задание готово +"+m.rew+" 🪙"); }
  }
  if(ch) save();
}

/* ================== меню ================== */
function syncMenu(){
  $("coins").textContent=S.coins; $("best").textContent=S.best;
  const done=S.mis?S.mis.filter(m=>m.done).length:0;
  $("misHint").textContent=done+"/"+(S.mis?S.mis.length:3);
  $("misDot").style.display=(S.mis&&done<S.mis.length)?"block":"none";
  $("shopHint").textContent=ZONES[S.zone].name+" · "+SKINS[S.skin].name;
  applySkin();
}
function openSheet(kind){
  const b=$("shBody"); let h="";
  if(kind==="shop"){
    $("shTitle").textContent="Магазин"; $("shLead").textContent="Монеты капают за каждый раунд";
    h+='<div class="sec">Прокачка</div>';
    UPS.forEach(u=>{
      const l=S.up[u.k], mx=l>=u.max, cost=u.cost(l);
      h+='<div class="item"><div class="ic">'+u.ic+'</div><div class="txt">'+
         '<b>'+u.name+' <span style="color:#ff3d6e">'+l+'/'+u.max+'</span></b><span>'+u.desc+'</span>'+
         '<div class="bar"><i style="width:'+(l/u.max*100)+'%"></i></div></div>'+
         '<button class="buy '+(mx?'owned':'')+'" data-up="'+u.k+'" '+((mx||S.coins<cost)?'disabled':'')+'>'+
         (mx?'макс':cost+' 🪙')+'</button></div>';
    });
    h+='<div class="sec">Районы</div>';
    ZONES.forEach((z,i)=>{
      const own=S.zones.includes(i), on=S.zone===i;
      h+='<div class="item '+(own?'':'locked')+'"><div class="ic">'+z.ic+'</div><div class="txt"><b>'+z.name+'</b>'+
         '<span>'+(own?('вес x'+z.mult+' · ППС '+z.cops):('открыть за '+z.cost+' 🪙'))+'</span></div>'+
         '<button class="buy '+(on?'owned':'')+'" data-zone="'+i+'" '+(((!own&&S.coins<z.cost)||on)?'disabled':'')+'>'+
         (on?'выбран':own?'играть':z.cost+' 🪙')+'</button></div>';
    });
    h+='<div class="sec">Скины</div>';
    SKINS.forEach((s,i)=>{
      const own=S.owned.includes(i), on=S.skin===i;
      h+='<div class="item '+(own?'':'locked')+'"><div class="ic">'+s.ic+'</div><div class="txt"><b>'+s.name+'</b>'+
         '<span>'+(s.desc||'')+(own?(on?' · надет':' · куплен'):' · '+s.cost+' 🪙')+'</span></div>'+
         '<button class="buy '+(on?'owned':'')+'" data-skin="'+i+'" '+(((!own&&S.coins<s.cost)||on)?'disabled':'')+'>'+
         (on?'надет':own?'надеть':s.cost+' 🪙')+'</button></div>';
    });
  } else {
    $("shTitle").textContent="Задания дня"; $("shLead").textContent="Обновятся завтра";
    (S.mis||[]).forEach(m=>{
      const p=Math.min(1,m.p/m.goal);
      h+='<div class="item"><div class="ic">'+(m.done?'✅':'🎯')+'</div><div class="txt">'+
         '<b>'+m.txt+'</b><span>'+(m.done?'получено':((Math.round(m.p*10)/10)+' / '+m.goal+' · +'+m.rew+' 🪙'))+'</span>'+
         '<div class="bar"><i style="width:'+(p*100)+'%"></i></div></div></div>';
    });
  }
  b.innerHTML=h; $("sheet").classList.add("on");
  b.querySelectorAll("[data-up]").forEach(el=>el.onclick=()=>{
    const u=UPS.find(x=>x.k===el.dataset.up), l=S.up[u.k], c=u.cost(l);
    if(l>=u.max||S.coins<c) return;
    S.coins-=c; S.up[u.k]++; save(); haptic("medium"); SFX.buy(); syncMenu(); openSheet("shop");
  });
  b.querySelectorAll("[data-skin]").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.skin, s=SKINS[i];
    if(!S.owned.includes(i)){ if(S.coins<s.cost) return; S.coins-=s.cost; S.owned.push(i); }
    S.skin=i; save(); haptic("medium"); SFX.buy(); syncMenu(); openSheet("shop");
  });
  b.querySelectorAll("[data-zone]").forEach(el=>el.onclick=()=>{
    const i=+el.dataset.zone, z=ZONES[i];
    if(!S.zones.includes(i)){ if(S.coins<z.cost) return; S.coins-=z.cost; S.zones.push(i); flash("🗺 район открыт!"); }
    S.zone=i; save(); haptic("medium"); SFX.buy(); applyZone(z); syncMenu(); openSheet("shop");
  });
}

/* ================== цикл ================== */
function menuCam(){
  const cx=2*(BLOCK+ROAD)+ROAD/2, cz=2*(BLOCK+ROAD)+ROAD/2;   // перекрёсток — обзор не упирается в дом
  cam.position.set(cx+Math.sin(menuAngle*.5)*70, 330, cz+330);
  cam.lookAt(cx,40,cz);
  player.position.set(cx,42,cz+120);
  body.scale.setScalar(42); halo.scale.set(294,294,1); body.visible=true;
  if(skinRing.visible){ skinRing.scale.setScalar(51); skinRing.rotation.z+=.012; }
  body.rotation.y=Math.sin(menuAngle*2.2)*.42;
  body.rotation.x=Math.sin(menuAngle*1.7)*.07;
  if(!LOWSPEC){ sun.position.set(cx-420,700,cz+340); sun.target.position.set(cx,0,cz); sun.target.updateMatrixWorld(); }
}
function tick(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(mode==="playing") step(dt); else { menuAngle+=dt*.06; menuCam(); }
  for(const s of pops){
    if(s.life<=0) continue;
    s.life-=dt*1.5; s.vy-=90*dt;
    s.sp.position.x+=s.vx*dt; s.sp.position.y+=s.vy*dt; s.sp.position.z+=s.vz*dt;
    const k=Math.max(.01,s.life);
    s.sp.scale.set(34*k,34*k,1);
    s.sp.material.opacity=k;
    if(s.life<=0){ scene.remove(s.sp); s.sp=null; }
  }
  for(const b of bits){
    if(b.life<=0) continue;
    b.vy-=430*dt; b.life-=dt*1.25;
    b.m.position.x+=b.vx*dt; b.m.position.y+=b.vy*dt; b.m.position.z+=b.vz*dt;
    b.m.scale.setScalar(Math.max(.01,b.life));
    if(b.life<=0||b.m.position.y<0){ b.life=0; b.m.visible=false; }
  }
  renderer.render(scene,cam);
  requestAnimationFrame(tick);
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix();
}
addEventListener("resize",resize); resize();

/* ---------- вступительный ролик ---------- */
let introDone=false, assetsReady=false;
function showMenu(){
  if(!introDone || !assetsReady) return;
  $("load").style.display="none";
  $("menu").classList.add("on");
}
function endIntro(){
  if(introDone) return;
  introDone=true;
  const v=$("introVid");
  try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
  const box=$("intro");
  box.style.opacity=0;
  setTimeout(()=>{ box.style.display="none"; }, 360);
  showMenu();
}
$("skip").onclick=endIntro;
(function playIntro(){
  const v=$("introVid");
  v.addEventListener("ended", endIntro);
  v.addEventListener("error", endIntro);
  const p=v.play();
  if(p && p.catch) p.catch(()=>{});               // автоплей заблокирован — просто ждём тапа/таймаута
  setTimeout(()=>{ if(!introDone && (v.readyState<2 || v.paused)) endIntro(); }, 4500);
  setTimeout(endIntro, 22000);                     // страховка, если ended не придёт
})();

checkDay(); syncMenu();
paintSky(ZONES[S.zone].sky[0],ZONES[S.zone].sky[1]);
loadAll(p=>{
  $("loadBar").style.width=(p*100)+"%";
  $("loadSt").textContent = p<1 ? "загружаем район… "+Math.round(p*100)+"%" : "поехали!";
}).then(()=>{
  applyZone(ZONES[S.zone]);
  for(let i=0;i<26;i++) placeSpot(newSpot());
  assetsReady=true; showMenu();
});
requestAnimationFrame(tick);
